name: Draft release

# Drafts a GitHub Release for the plugin version once CHANGELOG.md has a
# dated section for it. A person reviews and publishes the draft; publishing
# creates the v<version> tag if it does not exist yet.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Draft the release when one is due
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 scripts/release_notes.py --version)"
          tag="v${version}"

          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag ${REF_NAME} does not match plugin version ${version}."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release for ${tag} already exists. Nothing to do."
            exit 0
          fi

          status=0
          python3 scripts/release_notes.py > notes.md || status=$?
          if [ "$status" -eq 3 ]; then
            echo "CHANGELOG.md has no dated section for ${version}. Nothing to do."
            exit 0
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          bundle_dir="$RUNNER_TEMP/bundle"
          bash scripts/build-ai-tool-bundle.sh --all-areas --dist "$bundle_dir"

          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "legal-skills ${version}" \
            --notes-file notes.md \
            "$bundle_dir"/legal-skills-ai-*.zip
          echo "Drafted a release for ${tag} with the AI-tool bundle attached." >> "$GITHUB_STEP_SUMMARY"
