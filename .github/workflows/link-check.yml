name: Link check

on:
  schedule:
    - cron: "17 18 * * 1" # Tuesday 04:17 AEST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check official-source URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Probe every URL cited under plugins/
        run: python3 scripts/check_links.py
