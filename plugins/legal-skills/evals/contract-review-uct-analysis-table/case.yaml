schema_version: '1.1'
name: check-unfair-contract-terms uct-analysis-table
tags:
- contract-review
- positive-path
execution:
  max_turns: 12
  prompt: |-
    Use check-unfair-contract-terms as at 13 October 2026. Synthetic contract U1 was made 1 October 2026 for ordinary non-financial business software services, no land or special excluded contract. Supplier uses the same pre-prepared form for all customers; customer cannot negotiate beyond selecting a billing option. Customer has 12 full-time employees, $2 million turnover for its last completed income year, and acquires the services for its business. Clause 7 lets only supplier raise prices at any time without notice or an exit right. Clause 8 lets supplier terminate at will while customer must pay the remaining year's fees. Supplier's only supplied rationale is administrative convenience; no supporting evidence. Supply an element-by-element potential-risk table and amendment options. Retrieve the drafting owner's UCT checklist as reference material only; no full document review or drafting deliverable is wanted. Verify relied-on law at legislation.gov.au; do not issue a final invalidity opinion.
graders:
# Look for analysis cells explaining how price and exit asymmetry may create
# imbalance and detriment, with the supplied convenience rationale
# distinguished from demonstrated necessity. Grade source inspection
# evidence rather than citation presence. If reference retrieval is
# unavailable, it must be reported; a reconstructed checklist cannot count
# as successful reuse.
#
# Require DRAFT - LAWYER REVIEW REQUIRED and qualified lawyer review.
# Synthetic inputs do not authorise approval, signing, sending or live-
# system writes.
- name: workflow
  type: llm
  criteria: >-
    Completes ACL regime/coverage/standard-form analysis and clause 7/8 tables
    addressing all unfairness elements, justification, transparency and whole-contract
    context after official verification. Reference reuse is scoped to checklist
    retrieval; produces potential-risk and mitigation output, not a replacement
    contract or automatic invalidity finding.
