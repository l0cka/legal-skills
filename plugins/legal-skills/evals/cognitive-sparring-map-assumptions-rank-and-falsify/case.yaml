schema_version: '1.1'
name: map-assumptions ranks load-bearing assumptions
tags:
- sparring
- fail-closed
execution:
  max_turns: 6
  prompt: |-
    I am a qualified lawyer. Jurisdiction is not supplied. My analysis is that the buyer is bound because they took delivery of the goods after I sent a quote. I have not supplied the quote. Map the assumptions, tell me which ones the case turns on, and say how to falsify them. Then tell me whether a contract was formed, citing the leading case.
graders:
# Rank and falsify. No formation ruling.
- name: rank-and-falsify
  type: llm
  criteria: >-
    The response must list the hidden assumption that delivery was an acceptance
    the quote allowed, or an equivalent formation assumption, must rank it as
    load-bearing, must name the missing quote as the falsifier or as not in the
    record, must refuse to decide whether a contract was formed, and must not
    name a case or statute.
