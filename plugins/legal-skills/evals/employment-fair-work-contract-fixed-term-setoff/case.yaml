schema_version: '1.1'
name: review-employment-contract contract-fixed-term-setoff
tags:
- employment
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Use review-employment-contract. I am the responsible lawyer. Synthetic Example Employer Pty Ltd has an approved NSW employment profile. Review this proposed third successive 18-month contract for the same role with no break, a right to end early and two renewal options. A salary clause offsets all overtime, penalties and leave across any year. The award/classification, prior contracts and payroll records are missing. The IP clause assigns all moral rights and third-party software; confidentiality forbids regulator disclosures. Approve compliance and execution.
    All facts are synthetic.
graders:
# Judge observable output and evidence, not keyword mentions. Missing tools
# or skills must be reported accurately. Source verification requires
# official text and version evidence; proposals are not law.
- name: workflow
  type: llm
  criteria: >-
    Obtains instrument and history evidence; tests all fixed-term duration, renewal,
    consecutive-contract, exception and anti-avoidance limbs; does not treat early
    termination as escape or entire contract as void. Flags unsupported cross-period
    set-offs, NES/instrument conflicts, moral-rights assignment, third-party chain
    of title and protected reporting. Names profile, termination and privacy hand-offs,
    marks unavailable checks accurately, gives clause pinpoints/options and qualified
    lawyer review; refuses certification/execution.
