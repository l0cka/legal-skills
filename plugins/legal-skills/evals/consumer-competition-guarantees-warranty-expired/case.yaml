schema_version: '1.1'
name: assess-consumer-guarantees guarantees-warranty-expired
tags:
- consumer-competition
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Use assess-consumer-guarantees. Legal as-at date 13 October 2026. A synthetic household appliance overheated after repeated repairs. Its one-year warranty expired. The retailer refuses any remedy and sends us to the importer. A business buyer has the same defect and a blanket cap. Assess both and the warranty document without purchase-purpose or technical evidence.
graders:
# Judge observable output and actual official-source checks, not keyword
# mentions.
# Missing tools and hand-offs must be stated accurately; fixture packaging
# is not live evaluation.
- name: workflow
  type: llm
  criteria: >-
    Separates consumer coverage, major/cumulative failures and safety, goods remedies,
    manufacturer damages and non-exclusion; does not end rights on warranty expiry;
    checks s 64A type and fairness, reg 90 document controls; leaves missing evidence
    qualified and escalates safety. Requires qualified lawyer review, explicit
    assumptions and dated evidence.
