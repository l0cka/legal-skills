schema_version: '1.1'
name: check-unfair-contract-terms asic-price-difference
tags:
- contract-review
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Screen two standard-form agreements dated 1 October 2026. First is an ordinary goods supply; second is a financial product. One business party has 80 full-time employees and $12 million turnover; upfront price is $6 million, excluding any credit interest. Assume both pass the same ACL test and declare all unilateral variations void.
graders:
# Compare the two regime analyses, including the business limb and $6
# million price facts. Require inspection of the official ACL and ASIC
# texts; the financial-product small-business test must account for the $5
# million ceiling while the ACL test must not acquire that ceiling. Reject
# invented legal verification and automatic invalidity from the variation
# label alone.
#
# Require input provenance, the draft label and qualified lawyer review. A
# named source or skill is not evidence that it was inspected or invoked.
- name: workflow
  type: llm
  criteria: >-
    Verifies exact official text before conclusions, distinguishes ACL small-business
    test from ASIC s 12BF(4) $5 million ceiling, and does not equate thresholds
    or automatically declare unilateral variation void. Assesses regime, standard
    form, transition, exclusions, unfairness elements and missing facts.
