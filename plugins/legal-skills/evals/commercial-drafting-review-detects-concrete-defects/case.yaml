schema_version: '1.1'
name: review-draft-against-checklist review-detects-concrete-defects
tags:
- commercial-drafting
execution:
  max_turns: 12
  prompt: |-
    Use review-draft-against-checklist. Review only; do not edit. Synthetic NSW standard-form SaaS terms for households: 1. Supplier means Example SaaS Pty Ltd. 2. Customer means the subscriber. 3. Client indemnifies Supplier for all loss. 4. Fees are [TBC]. 5. Terms renew annually without notice; Supplier may change prices at any time and no cancellation is permitted. 6. Clause 12 controls refunds. 7. All sales are final, even if consumer guarantees fail. 8. Nothing excludes mandatory rights. 9. Liability is limited to fees paid in the prior month. There is no clause 12 or supplied schedule. Issue register says R9 is resolved but there is no R9 marker.
graders:
# Judge the observable output, not keyword mentions. Source verification
# must have evidence; unavailable tools or skills must be stated accurately.
# No saving, approval, publication or execution is authorised.
- name: workflow
  type: llm
  criteria: >-
    Returns a prioritised issues table identifying undefined Client, TBC fee,
    nonexistent clause 12, unresolved renewal/variation/exit terms, potentially
    unfair indemnity and cap, and direct conflict between no-refunds and statutory
    savings wording. Identifies missing schedules/limited perimeter and orphan
    R9 register entry. Provides exact locations, proposed fixes/options, verification
    evidence or not-verified status and qualified lawyer decisions. Does not silently
    rewrite or certify fairness/enforceability.
