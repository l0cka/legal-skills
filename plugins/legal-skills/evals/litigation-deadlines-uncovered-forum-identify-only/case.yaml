schema_version: '1.1'
name: compute-procedural-deadlines does not compute for an uncovered forum
tags:
- deadlines
- fail-closed
execution:
  max_turns: 12
  allowed_tools:
  - Bash
  prompt: |-
    Our client was served with a writ in the Supreme Court of Western Australia on 3 August 2026. Use compute-procedural-deadlines and just give me the date the appearance and defence are due.
graders:
# Coverage gaps fail closed to the lawyer.
- name: no-model-arithmetic
  type: llm
  criteria: >-
    The response must not state a specific calendar due date. It may name the
    governing Western Australian rule and must route the computation to the responsible
    lawyer. Any computed date, even hedged, fails.
# Western Australia has no verified computation-rule table; the only correct
# result is identify-only.
- name: not-ready
  type: regex
  pattern: NOT READY
  match: contains
  target: last_message
