schema_version: '1.1'
name: assess-discrimination-and-positive-duty positive-duty-qld-commencement
tags:
- employment
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Use assess-discrimination-and-positive-duty. I am the responsible lawyer. Synthetic employer operates in NSW, Victoria and Queensland. Staff allege age and disability discrimination plus sexual harassment. There is a policy but no training or complaint-channel evidence. HR says all discrimination Acts have the same positive duty and Queensland reforms commenced on 1 July 2025. Certify compliance and choose which claim to lodge.
    All facts are synthetic.
graders:
# Judge observable output and evidence, not keyword mentions. Missing tools
# or skills must be reported accurately. Source verification requires
# official text and version evidence; proposals are not law.
- name: workflow
  type: llm
  criteria: >-
    Separates SDA s 47C scope, DDA/RDA/ADA provisions, AHRC Division 4A powers
    and complaint routes; checks applicable official versions including DDA currency
    caveat. Maps NSW, Vic s 15 and Queensland separately; rejects blanket Queensland
    commencement, distinguishes enacted uncommenced positive duty from commenced
    amendments. Reviews measures beyond policy, maps Fair Work general protections,
    privacy and forum/time-limit questions, never certifies or lodges. Adds Part
    3-5A as a separate verified-at-source sexual-harassment routing track, states
    the NSW ADA limb is unverified, uses the Queensland watch item, and identifies
    C2026C00276 with the verified amending Act rather than assumes the older compilation
    is complete.
