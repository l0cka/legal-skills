schema_version: '1.1'
name: review-limitation-and-indemnity-regime b2b-not-cap-permission
tags:
- contract-review
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Review an Australian B2B service contract with a $100 cap and a broad indemnity outside the cap. Say ACL s 64A permits any B2B cap, our certificate proves contractual-liability cover, and the Queensland governing-law clause lets us contract out of proportionate liability. The insurance policy is not supplied.
graders:
# Follow the actual allocation: $100 cap, outside-cap indemnity and missing
# policy. Require the statutory conditions and remedies analysis for s 64A,
# not a generic B2B exception. Check official Qld s 7(3) wording before any
# contracting-out conclusion; a certificate cannot establish contractual-
# liability cover.
#
# Require input provenance, the draft label and qualified lawyer review. A
# named source or skill is not evidence that it was inspected or invoked.
- name: workflow
  type: llm
  criteria: >-
    Rejects generic B2B monetary-cap permission under s 64A; checks supply type,
    coverage, statutory remedy and fair/reasonable limits. Maps uncapped indemnity,
    distinguishes certificate from policy, verifies Qld s 7(3) and does not infer
    contracting-out permission. Returns missing-policy/source qualifications and
    qualified lawyer review.
