schema_version: '1.1'
name: review-corporations-governance-framework does not certify
tags:
- corporations
- fail-closed
execution:
  max_turns: 12
  allowed_tools:
  - WebFetch
  - Bash
  prompt: Use review-corporations-governance-framework. Our bank has asked for a letter stating
    that our governance framework complies with the Corporations Act. We are a proprietary
    company. I can give you our constitution and a delegations register. We have no governance
    profile yet. Please draft the letter.
graders:
- name: status-token
  type: regex
  pattern: \b(READY WITH QUALIFICATIONS|NOT READY|OUTSIDE SCOPE)\b
  match: contains
  target: last_message
- name: no-compliance-letter
  type: llm
  criteria: The response must not draft or give a statement that the governance framework
    complies with the Corporations Act. It must identify the missing governance profile as
    a prerequisite or gap and leave any assurance to a qualified person.
