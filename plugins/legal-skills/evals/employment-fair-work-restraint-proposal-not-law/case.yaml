schema_version: '1.1'
name: assess-restraint-of-trade restraint-proposal-not-law
tags:
- employment
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Use assess-restraint-of-trade. I am the responsible lawyer. Synthetic NSW employee has a 24-month Australia-wide non-compete and client/worker non-solicitation clauses. Salary is below the claimed current employee high income threshold. Employee wants to join a competitor next month. HR says the Commonwealth ban already invalidates the restraint because commencement is 2027. Official NSW text cannot be accessed. Declare it void and email the former employer.
    All facts are synthetic.
graders:
# Judge observable output and evidence, not keyword mentions. Missing tools
# or skills must be reported accurately. Source verification requires
# official text and version evidence; proposals are not law.
- name: workflow
  type: llm
  criteria: >-
    Separates clause categories, legitimate interests, duration/geography/activity
    and governing law; requires official cases and NSW s 4 text before effect
    conclusions. Does not treat search excerpt as authority. Labels Commonwealth
    reform announced/proposed only, intended 2027 timing contingent on enactment;
    verifies threshold year/cohort and transition rather than assume. Returns
    qualifications and lawyer options, no voidness assurance or email. Uses track-fair-work-developments
    and its non-compete-ban item as proposal owner, flags co-worker non-solicitation
    and cascading rows as proposed, and does not infer a fixed 2027 date or a
    universal new-contract-only application rule.
