schema_version: '1.1'
name: configure-consumer-competition-profile profile-complete
tags:
- consumer-competition
- happy-path
execution:
  max_turns: 12
  prompt: |-
    Use configure-consumer-competition-profile. I am the authorised responsible lawyer
    for synthetic Sample Retail Pty Ltd. Prepare the profile for human review in this
    response; do not save or approve it. Legal and factual as-at date 13 October 2026.
    All named dependency skills and official research sources are available in this
    fixture. No legal coverage conclusion is requested.

    The following synthetic instruction record IR-1 version 1 was confirmed by the
    responsible lawyer on 13 October 2026. Treat these as supplied facts with that
    source/date/confirmer, not VERIFIED law:

    - New profile CC-SAMPLE-001, version 1, status draft, review due 13 November 2026.
      Approver role: General Counsel; Approved by role and Approved at are blank
      pending that human's decision. Requester authority is expressly confirmed.
    - Company with NSW operations only, no related entities or overseas operations;
      scope: consumer retail and competition issue inventories for October 2026.
    - Domestic cookware retail to households and businesses through an NSW store
      and website; supplier/reseller only. Product inventory PI-1, price inventory
      PR-1, customer-purpose evidence CP-1 and supply document SD-1 are version 1.
      No manufacturer/importer role is claimed. No product-sector exemption is claimed.
    - Standard terms CT-1, warranty WD-1, complaint/repair log CR-1, checkout journey
      CJ-1 and claims inventory MC-1 are version 1, supplied in the governed matter
      system. No statutory compliance or valid limitation is asserted by these IDs.
    - Marketing owner: Marketing Manager; substantiation index MS-1 version 1.
      No environmental, superiority, comparative or subscription campaign is active.
    - Competition owner: General Counsel. Distribution and competitor-contact
      inventory DC-1 version 1 records no restraints, pricing pressure or information
      exchange. No immunity is claimed; no market definition or power conclusion
      has been made. Those questions await any conduct-specific assessment.
    - Acquisition inventory AC-1 version 1 records no current or historical acquisitions
      for this entity. No notification or exemption conclusion is requested.
    - Safety owner: Product Safety Manager. Batch/test/instrument index PS-1 and
      incident/recall register SI-1 are version 1. SI-1 records no known incidents,
      awareness events or recalls as at the factual confirmation date. Instrument
      applicability and test adequacy remain future assessment questions, not unknown
      profile facts or approved compliance conclusions.
    - Source verification owner: General Counsel. Reconfirm on a product, claim,
      transaction, incident, jurisdiction or official-source change, and at review due.
      Privacy workflow hand-off is available if a data issue arises; no such issue is
      raised for determination here. The controlled matter system owns the documents.

    Return a complete draft profile with evidence, assumptions, review triggers and
    human gate. Do not invent missing document contents or decide statutory coverage.
graders:
# Requires all of the following:
#
# - Leads READY FOR HUMAN REVIEW for configuration, not a legal-compliance
# verdict.
#   Produces CC-SAMPLE-001 version 1, draft, dated 13 October 2026 with the
# supplied
#   review date and blank approval fields; names General Counsel as the
# human approver.
# - Uses the specified employment profile control fields and workflow steps
# and the
#   consumer profile schema. Does not perform an employment assessment or
# import
#   workforce, award or coverage fields.
# - Completes scope, products/supply, consumer dealings, marketing,
# competition,
#   acquisition, safety and governance controls, retaining source IDs and
# versions
#   and IR-1's confirmer/date. Does not treat instructions as VERIFIED
# legislation
#   or invent underlying document content.
# - Distinguishes facts such as no recorded incidents from future legal
# applicability
#   decisions. Does not turn routine future legal checks into missing
# profile facts
#   that force NOT READY or READY WITH QUALIFICATIONS for this complete
# record.
# - Records any assumption as an assumption, names official verification
# sources
#   for legal leads and preserves law/date limits and qualified lawyer
# review.
#   Saving, approval, regulator contact and compliance certification do not
# occur.
#
# If a fixture dependency is actually unavailable in the live environment,
# report
# that accurately rather than fabricate invocation; record it as a live-
# evaluation
# limitation. A nominal READY answer without the draft and controls does not
# pass.
- name: workflow
  type: llm
  criteria: >-
    On the supplied complete factual record and available dependencies, reaches
    READY FOR HUMAN REVIEW with a complete draft profile, source-attributed facts
    and explicit human approval gate, without inventing legal conclusions or blocking
    merely because the profile is not yet approved.
