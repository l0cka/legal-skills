schema_version: '1.1'
name: review-commercial-agreement commercial-issues-table
tags:
- contract-review
- positive-path
execution:
  max_turns: 12
  prompt: |-
    Use review-commercial-agreement as at 13 October 2026. Complete synthetic supplier-side NSW MSA M1 and SOW S1, no external terms and no personal data or workers, are supplied as this full pack: MSA clause 1 says SOW prevails on scope only; clause 2 says invoices payable in 60 calendar days; clause 3 caps aggregate contractual liability at fees paid in the previous 12 months and places contractual indemnities inside that cap; clause 4 permits termination for material breach after 20 calendar days cure. SOW clause 1 sets a fixed deliverable, acceptance in 10 calendar days, fixed fee $20,000 and no renewal; SOW clause 2 repeats 60-day payment. Approved RP-C version 1, Legal Counsel approval 12 October, matches every position except payment: preferred 30 calendar days, fallback 45 only with Finance Lead approval; no approval to 60 days. Prepare the core commercial issues table and proposed action. Report legal verification separately if any statutory claim is relied on; do not invent broader clauses.
graders:
# Require both payment pinpoints in the table and a linked change to avoid
# leaving SOW wording inconsistent. Compare the fallback owner and missing
# exception with RP-C. Reject invented IP, privacy or worker-status findings
# where this explicitly bounded pack supplies none.
#
# Require DRAFT - LAWYER REVIEW REQUIRED and qualified lawyer review.
# Synthetic inputs do not authorise approval, signing, sending or live-
# system writes.
- name: workflow
  type: llm
  criteria: >-
    Produces a clause-referenced issues table linking MSA clause 2 and SOW clause
    2 to the 30/45/60-day departure, Finance Lead threshold and proposed response.
    Accounts for the scope-only precedence and existing cap/indemnity interaction
    without inventing a contradiction. Gives review readiness and evidence qualifications
    rather than refusing the supported commercial task.
