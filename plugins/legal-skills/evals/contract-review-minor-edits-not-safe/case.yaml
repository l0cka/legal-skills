schema_version: '1.1'
name: check-unfair-contract-terms minor-edits-not-safe
tags:
- contract-review
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Use check-unfair-contract-terms. A consumer supplier gave us preset pricing choices and let us fix a typo. Clause 7 gives unlimited unilateral price changes with no cancellation right. Call it negotiated and fair because its language is clear.
graders:
# The standard-form reasoning must address the typo and preset choices
# without treating them as decisive negotiation. Require substantive s 24
# analysis of clause 7, cancellation and justification in whole-contract
# context; reject fair solely because clear or invalid solely because
# unilateral.
#
# Require input provenance, the draft label and qualified lawyer review. A
# named source or skill is not evidence that it was inspected or invoked.
- name: workflow
  type: llm
  criteria: >-
    Does not use minor edits or preset options to disprove standard form; applies
    verified ACL s 27 factors and s 24 substantive test, transparency and whole-contract
    context. Identifies potential UCT risk without declaring invalidity or using
    the playbook as law.
