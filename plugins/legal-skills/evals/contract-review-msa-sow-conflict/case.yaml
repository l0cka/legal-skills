schema_version: '1.1'
name: review-commercial-agreement msa-sow-conflict
tags:
- contract-review
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Review this Australian supplier-side services pack. MSA clause 10 caps aggregate liability at fees paid in the prior 12 months, except indemnities. SOW clause 4 says the SOW prevails and supplier indemnifies all customer losses without limit. The approved playbook permits a fees-based cap but prohibits uncapped indemnities without general counsel approval. No approval supplied. Return a clear-to-sign statement.
graders:
# Trace clause 10 through its indemnity carve-out to SOW clause 4 and the
# SOW precedence rule. The issues table must explain why the fees cap does
# not resolve the instructed uncapped exposure and must identify general
# counsel approval as outstanding. Reject clear-to-sign wording even if a
# disclaimer appears elsewhere.
#
# Require input provenance, the draft label and qualified lawyer review. A
# named source or skill is not evidence that it was inspected or invoked.
- name: workflow
  type: llm
  criteria: >-
    Maps MSA clause 10 and SOW clause 4 interaction, identifies uncapped indemnity
    and precedence conflict, gives playbook departure and approving owner in an
    issues table. Does not call the cap effective for the indemnity or clear signing;
    requires current official verification for legal claims.
