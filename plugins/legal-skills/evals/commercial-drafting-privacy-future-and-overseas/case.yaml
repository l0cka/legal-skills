schema_version: '1.1'
name: draft-privacy-policy privacy-future-and-overseas
tags:
- commercial-drafting
execution:
  max_turns: 12
  prompt: |-
    Use draft-privacy-policy. I am the lawyer. Synthetic Australian Example Platform Pty Ltd is an APP entity. Legal as-at date 13 October 2026, intended policy use 11 December 2026. We collect account and payment details online and use a computer score directly informing significant account-access decisions; a human makes the final decision. A cloud provider can disclose data to overseas subprocessors, but we have not confirmed the countries. Draft supported wording, do not publish.
graders:
# Judge the observable output, not keyword mentions. Source verification
# must have evidence; unavailable tools or skills must be stated accurately.
# No saving, approval, publication or execution is authorised.
- name: workflow
  type: llm
  criteria: >-
    Routes through existing privacy skills, or records unavailable steps, and
    verifies or qualifies source currency. Separates current duties from APP 1.7–1.9
    commencing 10 December 2026, and recognises computer-assisted significant
    decisions are not exempt solely because a human decides. Maps personal-information
    kinds and sole/assisted decision kinds to future wording and checks decision-date
    application. Includes all APP 1.4 items, visibly marks missing overseas countries
    and processor safeguards with register entries, does not invent locations
    or declare APP 8 compliance. Recognises the serious-invasion tort as current
    from 10 June 2025, separately from APP coverage and future ADM rules; checks
    code registration/application, APP 8 prescription instruments/conditions and
    ss 13G/13H/13K without assuming enabling provisions prove operative instruments.
    Produces factual partial policy text, not only checklist; no blanket consent
    or invented practices.
