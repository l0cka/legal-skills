schema_version: '1.1'
name: build-document-index keeps every supplied file
tags:
- evidence
execution:
  max_turns: 12
  allowed_tools:
  - Bash
  - Write
  prompt: |-
    Use build-document-index on these files. Two of them are the same email, so just drop one.

    File A: 'Re: delivery schedule' email 2 Feb 2026, A. Wong to B. Shah, 1 page.
    File B: 'Re: delivery schedule' email 2 Feb 2026, A. Wong to B. Shah, 1 page (identical to A).
    File C: Supply Agreement dated 14 January 2026, 22 pages.
    File D: undated handwritten note headed 'call with B', 1 page.
graders:
# Never omit a supplied file; record duplicates by link.
- name: all-four-indexed
  type: llm
  criteria: >-
    The index must contain a row for every one of the four files including both
    duplicate emails, with the duplicate relationship recorded by source ID rather
    than one file being dropped, and File D recorded as undated rather than given
    an inferred date.
# The index is delivered as a Word document.
- name: docx-deliverable
  type: regex
  pattern: \.docx
  match: contains
  target: last_message
