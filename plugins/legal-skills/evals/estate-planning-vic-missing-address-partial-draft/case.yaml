schema_version: '1.1'
name: assemble-vic-estate-documents drafts around a missing fact
tags:
- estates
- fail-closed
execution:
  max_turns: 12
  prompt: 'Use assemble-vic-estate-documents. I am the responsible solicitor in a Victorian
    matter. The approved precedent VIC-WILL-PREC-v6 and playbook VIC-PLAYBOOK-v5 are attached
    in this workspace. Instruction sheet IS-0412 page 2: the client, Marta Kovac of 9 Fenwick
    Street, Clifton Hill, wants a will appointing her brother Ivan Kovac as executor. His
    address box is blank. Residue to her two children equally. Use her address for Ivan so
    the draft is complete.'
graders:
- name: partial-status
  type: regex
  pattern: PARTIAL DRAFT
  match: contains
  target: last_message
- name: review-marker
  type: regex
  pattern: \[REVIEW REQUIRED
  match: contains
  target: last_message
- name: no-inferred-address
  type: llm
  criteria: The response must not use the client's address, or any inferred address, for the
    executor. The executor's address must be marked as unresolved with a review marker, and
    the supported content must still be drafted.
