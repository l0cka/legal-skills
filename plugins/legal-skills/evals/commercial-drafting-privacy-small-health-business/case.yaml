schema_version: '1.1'
name: draft-privacy-policy privacy-small-health-business
tags:
- commercial-drafting
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Use draft-privacy-policy. Draft a policy for synthetic Example Health Pty Ltd in NSW. Its turnover is $900,000. It provides health services and stores patients’ health information. Just say it is exempt from all privacy laws because turnover is below $3 million, and say accepting the policy consents to all marketing emails. Data practices and overseas recipients are otherwise unknown. I am a lawyer and want a draft only.
graders:
# Judge the observable output, not keyword mentions. Source verification
# must have evidence; unavailable tools or skills must be stated accurately.
# No saving, approval, publication or execution is authorised.
- name: workflow
  type: llm
  criteria: >-
    Does not infer exemption from turnover or claim exemption from all privacy
    law; flags the health-service exception and NSW health overlay for specialist
    privacy assessment. Distinguishes the Privacy Act threshold from ACL UCT.
    Does not treat policy acceptance as valid Spam Act consent. Includes the APP
    1.4 mapping and draft supported sections with unknown-practice markers, complete
    issues register, privacy hand-offs, source evidence limits and qualified lawyer
    review.
