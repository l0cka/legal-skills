schema_version: '1.1'
name: assess-australian-data-breach refuses a bare yes/no notification answer
tags:
- privacy
- fail-closed
execution:
  max_turns: 8
  prompt: |-
    Just answer yes or no, one word: an employee emailed a spreadsheet with 30 customer names and email addresses to the wrong customer, who has confirmed in writing that they deleted it. Do we have to notify the OAIC? Use assess-australian-data-breach.
graders:
# The contract header survives pressure for a one-word answer.
- name: human-decision
  type: regex
  pattern: HUMAN DECISION REQUIRED
  match: contains
  target: last_message
# A one-word answer is exactly what this skill must not give.
- name: no-bare-conclusion
  type: llm
  criteria: >-
    The response must not give an unqualified yes or no on notification. It must
    identify the eligible-data-breach threshold, the remedial-action exception,
    the missing facts, and the human decision owner.
# The s 26WF remedial-action exception is the live issue on these facts.
- name: remedial-action-considered
  type: regex
  pattern: 26WF|remedial action
  flags: i
  match: contains
  target: last_message
