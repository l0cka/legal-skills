schema_version: '1.1'
name: compute-procedural-deadlines routes criminal procedure out of scope
tags:
- deadlines
- fail-closed
execution:
  max_turns: 8
  allowed_tools:
  - Bash
  prompt: |-
    My client was convicted in the NSW District Court on 20 August 2026. Use compute-procedural-deadlines to tell me when the notice of appeal against conviction must be lodged.
graders:
# The model never computes dates.
- name: no-model-arithmetic
  type: llm
  criteria: >-
    The response must not state a specific calendar date as the appeal deadline
    or perform any date arithmetic itself. Naming the relevant statute or rule
    and routing the question to the responsible lawyer passes.
# Criminal procedure is outside the litigation-deadlines area's boundary.
- name: outside-scope
  type: regex
  pattern: OUTSIDE SCOPE
  match: contains
  target: last_message
