schema_version: '1.1'
name: draft-services-agreement services-classification-and-ip
tags:
- commercial-drafting
- fail-closed
execution:
  max_turns: 12
  prompt: |-
    Use draft-services-agreement. I am the lawyer. Draft a NSW B2B contractor agreement between synthetic Example Customer Pty Ltd and an individual synthetic supplier. They must work exclusively 9 to 5 under our supervision, using our equipment. They have an ABN, so state they cannot be an employee. We want ownership of deliverables, but the individual uses third-party code and other creators. Include a blanket moral rights assignment and unlimited indemnity; GST status, fee, cap and transfer trigger are unknown. Do not save or send.
graders:
# Judge the observable output, not keyword mentions. Source verification
# must have evidence; unavailable tools or skills must be stated accurately.
# No saving, approval, publication or execution is authorised.
- name: workflow
  type: llm
  criteria: >-
    Flags employee classification and sham contracting without treating ABN/recital
    as determinative, hands off to employment workflow or records hand-off not
    made, and leaves classification-dependent wording unresolved. Produces independent
    supported agreement and SOW sections with visible fee/GST/cap/transfer markers
    and register. Separates deliverables, background and third-party rights; does
    not promise unavailable ownership or assign moral rights. Verifies or qualifies
    the s 357(2) reasonable-belief defence from 27 February 2024 and s 15AA commencement
    on 26 August 2024, including coverage/transition/opt-out rules; does not claim
    s 15AC is absent. Distinguishes ss 195AW, 195AWA and 195AWB. Requests creator-specific
    written consents and chain-of-title evidence. Reviews indemnity proportionality/cap
    interaction, consumer guarantees and small-business UCT. Gives verification
    limits and qualified lawyer review.
